services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      OSM_PBF_PATH: /data/italy-roads.osm.pbf
      OSM_EXTENT_PATH: /data/extent.geojson
      OSMNX_CACHE_FOLDER: /data/cache
      GRAPH_CACHE_DIR: /data/graph_cache
      GRAPH_SQLITE_PATH: /data/graph_cache/graph_tiles.sqlite
      GRAPH_PRELOAD: tiles
      GRAPH_SEED_ON_STARTUP: "true"
      GRAPH_SEED_MODES: foot,bicycle,car
      GRAPH_SEED_TRAVEL_TIMES_MIN: "15,30"
      GRAPH_SEED_CAR_MAX_TRAVEL_TIME_MIN: "15"
    volumes:
      - ./data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo:
    build:
      context: ./demo
    ports:
      - "8080:80"
    volumes:
      - ./demo/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      api:
        condition: service_healthy

  download:
    profiles: ["download"]
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      OSM_PBF_PATH: /data/italy-roads.osm.pbf
      OSM_EXTENT_PATH: /data/extent.geojson
    volumes:
      - ./data:/data
    command: ["uv", "run", "--no-dev", "python", "scripts/download_italy.py"]
