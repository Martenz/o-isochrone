services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      OSM_PBF_PATH: /data/italy-roads.osm.pbf
      OSM_EXTENT_PATH: /data/extent.geojson
      OSMNX_CACHE_FOLDER: /data/cache
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo:
    build:
      context: ./demo
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
