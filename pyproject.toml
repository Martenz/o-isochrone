[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oisochrone"
version = "0.1.0"
description = "Compute OSM road-network isochrones and return them as GeoJSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martino Boni" }]
keywords = ["isochrone", "osm", "osmnx", "geojson", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "networkx>=3.2",
    "python-dotenv>=1.0",
    "osmium>=4.3.1",
    "h3>=4.5.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
notebooks = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/Martenz/o-isochrone"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oisochrone"]

[tool.hatch.build.targets.wheel.force-include]
"src/oisochrone/data/coordinate_seed.json" = "oisochrone/data/coordinate_seed.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/oisochrone",
    "README.md",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
